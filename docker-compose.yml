services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flood_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-flood_risk_ktm}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flood_admin} -d ${POSTGRES_DB:-flood_risk_ktm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-flood_admin}:${POSTGRES_PASSWORD:-devpassword}@db:5432/${POSTGRES_DB:-flood_risk_ktm}
      # Pre-processed Nepal-wide OSM extract (buildings/roads/waterways)
      # on Cloudflare R2 -- the fallback osm.py uses when no local
      # *.osm.pbf covers the requested AOI. Empty/unset is fine (the
      # existing local-file fast path keeps working); config.py's
      # OSM_R2_*_URL constants read these the same way, and
      # DataSourceUnavailableError already gives a clear error if
      # neither local nor R2 is available. Real values live in a
      # gitignored .env, never committed here -- see .env.example.
      OSM_R2_BUILDINGS_URL: ${OSM_R2_BUILDINGS_URL:-}
      OSM_R2_ROADS_URL: ${OSM_R2_ROADS_URL:-}
      OSM_R2_WATERWAYS_URL: ${OSM_R2_WATERWAYS_URL:-}
      # config.py caps live cloud raster reads (DEM/WorldCover/population)
      # at a 30s HTTP timeout, which is too tight on a slow/variable
      # connection to AWS and makes GDAL tile reads fail
      # (TIFFReadEncodedTile) -> a 500 on compute. Raise the ceiling
      # (config.py reads these from the env); a generous timeout just
      # lets slow reads finish.
      GDAL_HTTP_TIMEOUT: ${GDAL_HTTP_TIMEOUT:-300}
      GDAL_HTTP_MAX_RETRY: ${GDAL_HTTP_MAX_RETRY:-5}
    volumes:
      - ./backend/app:/app/app
      - ./backend/tests:/app/tests
      - ./schemas:/app/schemas:ro
      # Local pre-downloaded sources (backend/data/raw/ -- DEM/WorldCover/
      # OSM/basins) and the per-AOI processed cache (backend/data/cache/).
      # Without this, the container's /app/data/ is whatever the image
      # was built with (nothing -- the Dockerfile never COPYs data/), so
      # every local-check-first source falls straight through to its
      # cloud/R2 fallback (or, for basins/OSM, a 503) no matter what's
      # actually on the host -- this was a real, user-visible bug, not
      # just a theoretical gap: config.py's DATA_DIR default resolves to
      # exactly /app/data inside this container, matching the mount
      # target below.
      - ./backend/data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      # Mounted so Vite's dev config (esp. server.watch.usePolling, needed
      # for HMR to see edits across the Windows->container bind mount) is
      # the live host file, not the stale one baked into the image.
      - ./frontend/vite.config.js:/app/vite.config.js
      # public/ (favicon, other static-as-is assets) didn't exist on the
      # host when the earlier mounts above were set up, so it was never
      # added -- Vite serves this directory's contents verbatim at the
      # site root (e.g. public/icon.png -> /icon.png), which needs the
      # real host directory mounted the same way src/ already is, not
      # just baked into the image at build time.
      - ./frontend/public:/app/public
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
